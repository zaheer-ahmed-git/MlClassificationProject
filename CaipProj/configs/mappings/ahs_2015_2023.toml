feature_wave_rule = "eligible completed interview in the earlier adjacent wave"
label_wave_rule = "eligible completed owner interview in the later adjacent wave"
label_source_field = "MAINTAMT"
label_edit_flag = "JMAINTAMT"
label_task = "future_routine_cost_proxy_v1"
label_currency = "USD"
label_period_semantics = "typical-year amount reported in the later biennial wave"
label_response_maximum_through_2021_usd = 10000
label_response_maximum_2023_usd = 100000
forecast_claim = "later-wave proxy task only; not an operational next-12-month WAPDA label"
modeling_view = "AHS only; must not be stacked with RHFS labels"
