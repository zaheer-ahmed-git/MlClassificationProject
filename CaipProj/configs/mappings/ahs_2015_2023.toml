mapping_version = "ahs_adjacent_wave_v1"
source_id = "ahs_2015_2023"
source_release = "official_2015_2023"
source_grain = "one housing unit in one biennial national PUF wave"
waves = [2015, 2017, 2019, 2021, 2023]
native_key = "CONTROL"
