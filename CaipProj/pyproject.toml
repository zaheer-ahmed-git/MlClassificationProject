[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caip-maintenance"
version = "0.1.0"
description = "Lineage-preserving public data and proxy modeling for CAIP maintenance cost"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.2.0",
  "numpy==1.24.2",
  "scikit-learn==1.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
